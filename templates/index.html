<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wiki-CN 问答</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css?v=6" />
</head>
<body>
  <aside class="sidebar" aria-label="会话历史">
    <div class="sidebar-header">
      <a class="brand" href="/" aria-label="Wiki-CN 问答首页">
        <img src="/static/favicon.svg" alt="" />
        <span>Wiki-CN</span>
      </a>
      <button id="newChatBtn" class="new-chat-btn" type="button" title="新建会话">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>新会话</span>
      </button>
    </div>

    <div class="sidebar-section-title">历史会话</div>
    <div class="sidebar-list-container" id="sidebarListContainer"></div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button id="toggleSidebarBtn" class="icon-btn" type="button" title="收起侧边栏" aria-label="收起侧边栏">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
        </button>
        <div>
          <div class="eyebrow">Wiki-CN RAG Runtime</div>
          <h1>知识库问答</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="toggleRuntimeBtn" class="status-chip neutral" type="button">
          <span id="engineStatus">正在检查...</span>
        </button>
        <a class="ghost-btn" href="/api/health">健康面板</a>
        <button id="toggleStatusBtn" class="ghost-btn" type="button">模块状态</button>
      </div>
    </header>

    <section class="chat-panel">
      <div class="chat-history" id="chatHistory"></div>
      <div class="composer-wrap" aria-label="提问输入区">
        <div class="chat-input-area">
          <div class="input-wrapper">
            <textarea id="q" rows="1" placeholder="向 Wiki-CN 提问"></textarea>
            <button id="askBtn" class="send-btn" type="button" title="发送">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7Z"/></svg>
            </button>
          </div>
          <div class="input-controls">
            <label class="control-item" for="allowWeb">
              <input id="allowWeb" type="checkbox" />
              <span>联网补充</span>
            </label>
            <label class="control-item compact" for="historyLen">
              <span>记忆轮数</span>
              <input id="historyLen" type="number" min="0" max="10" value="5" class="num-input" />
            </label>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="statusModal" class="status-modal" style="display:none;">
    <div class="status-modal-content">
      <div class="modal-head">
        <div>
          <div class="section-kicker">Runtime</div>
          <h2>模块状态</h2>
        </div>
        <button id="closeStatusBtn" class="ghost-btn" type="button">关闭</button>
      </div>
      <ul id="moduleStatusList" class="module-status-list"></ul>
    </div>
  </div>

  <div id="runtimeModal" class="status-modal" style="display:none;">
    <div class="status-modal-content runtime-modal-content">
      <div class="modal-head">
        <div>
          <div class="section-kicker">Health Snapshot</div>
          <h2>运行状态</h2>
        </div>
        <button id="closeRuntimeBtn" class="ghost-btn" type="button">关闭</button>
      </div>
      <div class="runtime-grid">
        <div class="runtime-metric">
          <span>检索模式</span>
          <strong id="runtimeMode">-</strong>
        </div>
        <div class="runtime-metric">
          <span>索引规模</span>
          <strong id="runtimeIndex">-</strong>
        </div>
        <div class="runtime-metric">
          <span>当前阶段</span>
          <strong id="runtimeStage">-</strong>
        </div>
        <div class="runtime-metric">
          <span>生成通道</span>
          <strong id="runtimeProvider">-</strong>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/app.js?v=8"></script>
</body>
</html>
